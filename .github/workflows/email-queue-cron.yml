name: Procesar cola de emails

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-email-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validar configuracion
        env:
          EMAIL_CRON_BASE_URL: ${{ secrets.EMAIL_CRON_BASE_URL }}
          EMAIL_CRON_SECRET: ${{ secrets.EMAIL_CRON_SECRET }}
        run: |
          if [ -z "$EMAIL_CRON_BASE_URL" ]; then
            echo "Falta el secret EMAIL_CRON_BASE_URL"
            exit 1
          fi

          if [ -z "$EMAIL_CRON_SECRET" ]; then
            echo "Falta el secret EMAIL_CRON_SECRET"
            exit 1
          fi

      - name: Ejecutar procesador de emails
        env:
          EMAIL_CRON_BASE_URL: ${{ secrets.EMAIL_CRON_BASE_URL }}
          EMAIL_CRON_SECRET: ${{ secrets.EMAIL_CRON_SECRET }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl --silent --show-error --location \
            --request POST \
            --url "${EMAIL_CRON_BASE_URL%/}/api/cron/email" \
            --header "Authorization: Bearer ${EMAIL_CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --header "User-Agent: github-actions-email-queue" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}")"

          echo "HTTP ${HTTP_STATUS}"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo ""
            echo "La ejecucion del cron de emails fallo."
            exit 1
          fi
